[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "routeros-update"
version = "0.1.0"
description = "Update MikroTik RouterOS across a fleet by fetching the package locally and pushing it over SSH"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Bryan Seitz" }]
keywords = ["mikrotik", "routeros", "netmiko", "ssh", "upgrade", "npk"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: System :: Networking",
]
dependencies = [
    "netmiko>=4.7,<5",
    "PyYAML>=6",
    "rich>=13",
]

[project.urls]
Homepage = "https://github.com/seitzbg/routeros-update"

[project.scripts]
routeros-update = "routeros_update:main"

[tool.setuptools]
py-modules = ["routeros_update"]
